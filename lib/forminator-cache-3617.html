<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>News & Events Inquiry Form - Ascendia Prime</title>

	<link rel='stylesheet' id='forminator-icons-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/forminator-icons.min.css?ver=1.57.1' media='all' />
	<link rel='stylesheet' id='forminator-utilities-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/forminator-utilities.min.css?ver=1.57.1' media='all' />
	<link rel='stylesheet' id='forminator-grid-default-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/grid/forminator-grid.open.min.css?ver=1.57.1' media='all' />
	<link rel='stylesheet' id='forminator-forms-default-base-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/form/forminator-form-default.base.min.css?ver=1.57.1' media='all' />
	<link rel='stylesheet' id='forminator-forms-default-select2-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/form/forminator-form-default.select2.min.css?ver=1.57.1' media='all' />
	<link rel='stylesheet' id='forminator-forms-default-full-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/form/forminator-form-default.full.min.css?ver=1.57.1' media='all' />
</head>
<body class="forminator-custom-form-3617">
  <form
    id="forminator-module-3617"
    class="forminator-ui forminator-custom-form forminator-custom-form-3617 forminator-design--default forminator_ajax"
    action=""
    onsubmit="return false;"
    method="post"
    data-forminator-render="0"
    data-form-id="3617"
    data-color-option="theme"
    data-design="default"
    data-grid="open"
    style="display: none;"
    data-uid="6a92793617events"
  >
    <div role="alert" aria-live="polite" class="forminator-response-message forminator-error" aria-hidden="true"></div>

    <!-- Row 1: Full Name & Business Email -->
    <div class="forminator-row">
      <div id="name-1" class="forminator-field-name forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-field-name-1_3617" id="forminator-field-name-1_3617-label" class="forminator-label">
            Full Name <span class="forminator-required">*</span>
          </label>
          <input type="text" name="name-1" value="" placeholder="e.g. Alex Sterling" id="forminator-field-name-1_3617" class="forminator-input forminator-name--field" aria-required="true" autocomplete="name" />
        </div>
      </div>
      <div id="email-1" class="forminator-field-email forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-field-email-1_3617" id="forminator-field-email-1_3617-label" class="forminator-label">
            Business Email <span class="forminator-required">*</span>
          </label>
          <input type="email" name="email-1" value="" placeholder="alex@company.com" id="forminator-field-email-1_3617" class="forminator-input forminator-email--field" data-required="true" aria-required="true" autocomplete="email" />
        </div>
      </div>
    </div>

    <!-- Row 2: Company & Event You Are Attending -->
    <div class="forminator-row">
      <div id="text-1" class="forminator-field-text forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-field-text-1_3617" id="forminator-field-text-1_3617-label" class="forminator-label">
            Company <span class="forminator-required">*</span>
          </label>
          <input type="text" name="text-1" value="" placeholder="e.g. Acme Media Corp" id="forminator-field-text-1_3617" class="forminator-input forminator-name--field" data-required="1" aria-required="true" />
        </div>
      </div>
      <div id="select-1" class="forminator-field-select forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-form-3617__field--select-1" id="forminator-form-3617__field--select-1-label" class="forminator-label">
            Event You Are Attending
          </label>
          <select id="forminator-form-3617__field--select-1" class="forminator-select--field forminator-select2" name="select-1" data-placeholder="Select an event" aria-labelledby="forminator-form-3617__field--select-1-label">
            <option value="">Select an event</option>
            <option value="Affilifest North 2026">Affilifest North 2026</option>
            <option value="DMEXCO 2026">DMEXCO 2026</option>
            <option value="Advertising Week New York 2026">Advertising Week New York 2026</option>
            <option value="PI LIVE Europe 2026">PI LIVE Europe 2026</option>
            <option value="Affiliate World Asia 2026">Affiliate World Asia 2026</option>
            <option value="Affiliate Summit West 2027">Affiliate Summit West 2027</option>
            <option value="Another event">Another event</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Row 3: What would you like to discuss? -->
    <div class="forminator-row">
      <div id="textarea-1" class="forminator-field-textarea forminator-col forminator-col-12">
        <div class="forminator-field">
          <label for="forminator-field-textarea-1_3617" id="forminator-field-textarea-1_3617-label" class="forminator-label">
            What would you like to discuss? <span class="forminator-required">*</span>
          </label>
          <span id="forminator-field-textarea-1_3617-description" class="forminator-description">
            <span data-limit="250" data-type="characters" data-editor="">0 / 250</span>
          </span>
          <textarea name="textarea-1" placeholder="For example: advertiser acquisition, publisher partnership, paid media or retargeting" id="forminator-field-textarea-1_3617" class="forminator-textarea" style="--forminator-textarea-min-height:120px;" maxlength="250" aria-required="true"></textarea>
        </div>
      </div>
    </div>

    <input type="hidden" name="referer_url" value="" />
    <div class="forminator-row forminator-row-last">
      <div class="forminator-col">
        <div class="forminator-field">
          <button class="forminator-button forminator-button-submit">Send Enquiry</button>
        </div>
      </div>
    </div>

    <input type="hidden" id="forminator_nonce" name="forminator_nonce" value="7a550b8806" />
    <input type="hidden" name="_wp_http_referer" value="/news-and-events/" />
    <input type="hidden" name="form_id" value="3617">
    <input type="hidden" name="page_id" value="3617">
    <input type="hidden" name="form_type" value="default">
    <input type="hidden" name="current_url" value="https://ascendiaprime.com/news-and-events/">
    <input type="hidden" name="render_id" value="0">
    <input type="hidden" name="action" value="forminator_submit_form_custom-forms">
  </form>

  <script id="jquery-core-js" src="https://ascendiaprime.com/wp-includes/js/jquery/jquery.min.js?ver=3.7.1"></script>
  <script id="forminator-select2-js" src="https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/js/select2.full.min.js?ver=1.57.1"></script>
  <script id="forminator-jquery-validate-js" src="https://ascendiaprime.com/wp-content/plugins/forminator/assets/js/library/jquery.validate.min.js?ver=1.57.1"></script>
  <script id="forminator-form-js" src="https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/js/forminator-form.min.js?ver=1.57.1"></script>
  <script id="forminator-front-scripts-js" src="https://ascendiaprime.com/wp-content/plugins/forminator/build/front/front.multi.min.js?ver=1.57.1"></script>
  <script type="text/javascript">
    jQuery(function() {
      jQuery.ajax({
        url: "/api/forminator/ajax",
        type: "POST",
        data: { action: "forminator_get_nonce", form_id: "3617" },
        success: function (response) {
          if (response && response.data) {
            jQuery("#forminator-module-3617 #forminator_nonce").val(response.data);
          }
        }
      });

      // Live character counter for textarea-1
      var $msgTextarea = jQuery("#forminator-field-textarea-1_3617");
      var $counter = jQuery("#forminator-field-textarea-1_3617-description span[data-limit]");
      if ($msgTextarea.length && $counter.length) {
        $msgTextarea.on("input keyup paste change", function() {
          var len = jQuery(this).val().length;
          $counter.text(len + " / 250");
        });
      }
    });
  </script>
</body>
</html>
