<head>
	<meta charset="UTF-8" />

	<link rel='stylesheet' id='forminator-utilities-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/forminator-utilities.min.css?ver=1.57.1' media='all' />
	<link rel='stylesheet' id='forminator-grid-default-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/grid/forminator-grid.open.min.css?ver=1.57.1' media='all' />
	<link rel='stylesheet' id='forminator-forms-default-base-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/form/forminator-form-default.base.min.css?ver=1.57.1' media='all' />
	<link rel='stylesheet' id='forminator-forms-default-select2-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/form/forminator-form-default.select2.min.css?ver=1.57.1' media='all' />
	<link rel='stylesheet' id='forminator-forms-default-full-css' href='https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/css/src/form/forminator-form-default.full.min.css?ver=1.57.1' media='all' />
</head>
<body class="forminator-custom-form-3611">
  <form
    id="forminator-module-3611"
    class="forminator-ui forminator-custom-form forminator-custom-form-3611 forminator-design--default forminator_ajax"
    action=""
    onsubmit="return false;"
    method="post"
    data-forminator-render="0"
    data-form-id="3611"
    data-color-option="theme"
    data-design="default"
    data-grid="open"
    style="display: none;"
    data-uid="6a92793611retarget"
  >
    <div role="alert" aria-live="polite" class="forminator-response-message forminator-error" aria-hidden="true"></div>

    <!-- Row 1: Full Name & Email Address -->
    <div class="forminator-row">
      <div id="name-1" class="forminator-field-name forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-field-name-1_3611" id="forminator-field-name-1_3611-label" class="forminator-label">
            Full Name <span class="forminator-required">*</span>
          </label>
          <input type="text" name="name-1" value="" placeholder="" id="forminator-field-name-1_3611" class="forminator-input forminator-name--field" aria-required="true" autocomplete="name" />
        </div>
      </div>
      <div id="email-1" class="forminator-field-email forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-field-email-1_3611" id="forminator-field-email-1_3611-label" class="forminator-label">
            Email Address <span class="forminator-required">*</span>
          </label>
          <input type="email" name="email-1" value="" placeholder="" id="forminator-field-email-1_3611" class="forminator-input forminator-email--field" data-required="true" aria-required="true" autocomplete="email" />
        </div>
      </div>
    </div>

    <!-- Row 2: Company Name & Website -->
    <div class="forminator-row">
      <div id="text-1" class="forminator-field-text forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-field-text-1_3611" id="forminator-field-text-1_3611-label" class="forminator-label">
            Company Name <span class="forminator-required">*</span>
          </label>
          <input type="text" name="text-1" value="" placeholder="" id="forminator-field-text-1_3611" class="forminator-input forminator-name--field" data-required="1" />
        </div>
      </div>
      <div id="url-1" class="forminator-field-url forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-field-url-1_3611" id="forminator-field-url-1_3611-label" class="forminator-label">
            Website <span class="forminator-required">*</span>
          </label>
          <input type="url" name="url-1" value="" placeholder="" id="forminator-field-url-1_3611" class="forminator-input forminator-website--field" data-required="1" aria-required="true" />
        </div>
      </div>
    </div>

    <!-- Row 3: Primary Objective & Current Channels -->
    <div class="forminator-row">
      <div id="select-1" class="forminator-field-select forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-form-3611__field--select-1" id="forminator-form-3611__field--select-1-label" class="forminator-label">
            Primary Objective <span class="forminator-required">*</span>
          </label>
          <select id="forminator-form-3611__field--select-1" class="forminator-select--field forminator-select2 forminator-select2-multiple" data-required="1" name="select-1" data-default-value="" data-hidden-behavior="zero" data-placeholder="Select One" data-search="false" data-search-placeholder="Select One" data-checkbox="false" data-allow-clear="false" aria-labelledby="forminator-form-3611__field--select-1-label">
            <option value="">Select One</option>
            <option value="one" data-calculation="0">Recover ecommerce sales</option>
            <option value="two" data-calculation="0">Increase lead completion</option>
            <option value="Improve existing retargeting" data-calculation="0">Improve existing retargeting</option>
            <option value="Activating first-party audiences" data-calculation="0">Activating first-party audiences</option>
            <option value="custom_option" data-calculation="0">Other</option>
          </select>
          <div class="forminator-field forminator-custom-input" style="display: none; margin-top: 8px;">
            <input id="custom-forminator-form-3611__field--select-1" name="custom-select-1" class="forminator-input" placeholder="Please specify your objective" aria-label="Other" value="" />
          </div>
        </div>
      </div>
      <div id="textarea-1" class="forminator-field-textarea forminator-col forminator-col-6">
        <div class="forminator-field">
          <label for="forminator-field-textarea-1_3611" id="forminator-field-textarea-1_3611-label" class="forminator-label">
            Current Channels <span class="forminator-required">*</span>
          </label>
          <textarea name="textarea-1" placeholder="" id="forminator-field-textarea-1_3611" class="forminator-textarea" style="--forminator-textarea-min-height:52px; height: 52px;" data-required="1"></textarea>
        </div>
      </div>
    </div>

    <!-- Row 4: How can we help you? -->
    <div class="forminator-row">
      <div id="textarea-2" class="forminator-field-textarea forminator-col forminator-col-12">
        <div class="forminator-field">
          <label for="forminator-field-textarea-2_3611" id="forminator-field-textarea-2_3611-label" class="forminator-label">
            How can we help you? <span class="forminator-required">*</span>
          </label>
          <span id="forminator-field-textarea-2_3611-description" class="forminator-description">
            <span data-limit="250" data-type="characters" data-editor="">0 / 250</span>
          </span>
          <textarea name="textarea-2" placeholder="" id="forminator-field-textarea-2_3611" class="forminator-textarea" style="--forminator-textarea-min-height:120px;" maxlength="250"></textarea>
        </div>
      </div>
    </div>

    <input type="hidden" name="referer_url" value="" />
    <div class="forminator-row forminator-row-last">
      <div class="forminator-col">
        <div class="forminator-field">
          <button class="forminator-button forminator-button-submit">Submit</button>
        </div>
      </div>
    </div>

    <input type="hidden" id="forminator_nonce" name="forminator_nonce" value="7a550b8806" />
    <input type="hidden" name="_wp_http_referer" value="/retargeting-campaigns/" />
    <input type="hidden" name="form_id" value="3611">
    <input type="hidden" name="page_id" value="3611">
    <input type="hidden" name="form_type" value="default">
    <input type="hidden" name="current_url" value="https://ascendiaprime.com/retargeting-campaigns/">
    <input type="hidden" name="render_id" value="0">
    <input type="hidden" name="action" value="forminator_submit_form_custom-forms">
  </form>

  <script id="jquery-core-js" src="https://ascendiaprime.com/wp-includes/js/jquery/jquery.min.js?ver=3.7.1"></script>
  <script id="forminator-select2-js" src="https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/js/select2.full.min.js?ver=1.57.1"></script>
  <script id="forminator-jquery-validate-js" src="https://ascendiaprime.com/wp-content/plugins/forminator/assets/js/library/jquery.validate.min.js?ver=1.57.1"></script>
  <script id="forminator-form-js" src="https://ascendiaprime.com/wp-content/plugins/forminator/assets/forminator-ui/js/forminator-form.min.js?ver=1.57.1"></script>
  <script id="forminator-front-scripts-js" src="https://ascendiaprime.com/wp-content/plugins/forminator/build/front/front.multi.min.js?ver=1.57.1"></script>
  <script type="text/javascript">
    jQuery(function() {
      jQuery.ajax({
        url: "/api/forminator/ajax",
        type: "POST",
        data: { action: "forminator_get_nonce", form_id: "3611" },
        success: function (response) {
          if (response && response.data) {
            jQuery("#forminator-module-3611 #forminator_nonce").val(response.data);
          }
        }
      });

      // Live character counter for textarea-2
      var $msgTextarea = jQuery("#forminator-field-textarea-2_3611");
      var $counter = jQuery("#forminator-field-textarea-2_3611-description span[data-limit]");
      if ($msgTextarea.length && $counter.length) {
        $msgTextarea.on("input keyup paste change", function() {
          var len = jQuery(this).val().length;
          $counter.text(len + " / 250");
        });
      }

      // Objective dropdown toggle for custom input
      var $select = jQuery("#forminator-form-3611__field--select-1");
      var $customWrap = jQuery(".forminator-custom-input");
      var $customInput = jQuery("#custom-forminator-form-3611__field--select-1");
      $select.on("change", function() {
        var val = jQuery(this).val();
        if (val === "custom_option" || val === "Other") {
          $customWrap.slideDown(200);
          $customInput.focus();
        } else {
          $customWrap.slideUp(200);
          $customInput.val("");
        }
      });
    });
  </script>
</body>
</html>
